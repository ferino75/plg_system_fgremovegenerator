PLG_SYSTEM_FGREMOVEGENERATOR="FG - Remove Generator"
PLG_SYSTEM_FGREMOVEGENERATOR_XML_DESCRIPTION="Removes the Joomla generator meta tag and optional fingerprinting HTTP headers (X-Powered-By, X-Generator, X-AspNet-Version)."
PLG_SYSTEM_FGREMOVEGENERATOR_MODE_LABEL="Mode"
PLG_SYSTEM_FGREMOVEGENERATOR_MODE_DESC="Remove the generator meta tag completely, or replace it with custom text."
PLG_SYSTEM_FGREMOVEGENERATOR_MODE_REMOVE="Remove completely"
PLG_SYSTEM_FGREMOVEGENERATOR_MODE_CUSTOM="Custom text"
PLG_SYSTEM_FGREMOVEGENERATOR_CUSTOM_TEXT_LABEL="Custom generator text"
PLG_SYSTEM_FGREMOVEGENERATOR_CUSTOM_TEXT_DESC="Text to show instead of the default Joomla generator string."
PLG_SYSTEM_FGREMOVEGENERATOR_APPLY_ADMIN_LABEL="Apply generator setting to Administrator"
PLG_SYSTEM_FGREMOVEGENERATOR_APPLY_ADMIN_DESC="Also remove/replace the generator meta tag in the administrator backend. This only affects the generator meta tag — the X-Powered-By / X-Generator / X-AspNet-Version headers below are always removed everywhere, including the administrator, when enabled."
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XPB_LABEL="Remove X-Powered-By header"
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XPB_DESC="Removes the X-Powered-By HTTP header sent by PHP, if it was not already suppressed by expose_php=Off in php.ini. Works only if headers have not been sent yet."
PLG_SYSTEM_FGREMOVEGENERATOR_FIELDSET_HEADERS="Additional headers"
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XGEN_LABEL="Remove X-Generator header"
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XGEN_DESC="Removes the X-Generator HTTP header, if it is set by a template or extension (Joomla itself does not send this header by default). Works only if headers have not been sent yet."
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XASPNET_LABEL="Remove X-AspNet-Version header"
PLG_SYSTEM_FGREMOVEGENERATOR_REMOVE_XASPNET_DESC="Removes the X-AspNet-Version HTTP header. Not applicable on a PHP/Joomla stack, included only for completeness or mixed environments."
